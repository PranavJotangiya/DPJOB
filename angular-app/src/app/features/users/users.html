<section class="page-stack">
  <div class="panel-card">
    <div class="panel-header"><h3>{{ 'users.add' | t }}</h3></div>
    <div class="wizard-grid">
      <div class="field-group">
        <label class="field-label">{{ 'users.username' | t }}</label>
        <input autocapitalize="none" [ngModel]="form().username" (ngModelChange)="patch('username', $event)" />
      </div>
      <div class="field-group">
        <label class="field-label">{{ 'users.name' | t }}</label>
        <input [ngModel]="form().name" (ngModelChange)="patch('name', $event)" />
      </div>
      <div class="field-group">
        <label class="field-label">{{ 'users.pin' | t }}</label>
        <input inputmode="numeric" maxlength="6" [ngModel]="form().pin" (ngModelChange)="patch('pin', $event)" />
      </div>
    </div>
    @if (takenError()) {
      <div class="login-error">{{ 'users.taken' | t }}</div>
    }
    <div class="inline-actions top-gap">
      <button type="button" class="primary-button small" [disabled]="!canAdd()" (click)="add()">
        {{ 'users.add' | t }}
      </button>
    </div>
  </div>

  <div class="panel-card">
    <div class="panel-header"><h3>{{ 'page.users' | t }}</h3></div>
    <div class="user-list">
      @for (u of users(); track u.username) {
        <div class="user-row" [class.disabled]="!u.active">
          <div class="user-main">
            <strong>{{ u.name }}</strong>
            <span class="user-uname">@{{ u.username }}</span>
            @if (u.username === session.currentUser()?.username) {
              <span class="user-you">{{ 'users.you' | t }}</span>
            }
          </div>

          <div class="user-controls">
            <div class="inline-field">
              <input
                class="pin-input"
                inputmode="numeric"
                maxlength="6"
                [placeholder]="'users.newPin' | t"
                [ngModel]="pinEdits()[u.username] || ''"
                (ngModelChange)="setPinEdit(u.username, $event)"
              />
              <button type="button" class="ghost-button small" (click)="savePin(u.username)">
                {{ 'users.save' | t }}
              </button>
            </div>

          </div>
        </div>
      }
    </div>
  </div>
</section>
