<section class="page-stack">
  <div class="dash-party">
    <label class="field-label">{{ (isParty() ? 'signup.jobber' : 'f.party') | t }}</label>
    <select [ngModel]="filterValue()" (ngModelChange)="setFilter($event)">
      <option value="">{{ (isParty() ? 'dash.allJobbers' : 'party.all') | t }}</option>
      @for (opt of filterOptions(); track opt.value) {
        <option [value]="opt.value">{{ opt.label }}</option>
      }
    </select>
  </div>

  <div class="summary-grid">
    <app-stat-card icon="📦" [label]="'stat.activeLots' | t" [value]="stats().activeLots" tone="blue" />
    <app-stat-card icon="✔️" [label]="'stat.completedLots' | t" [value]="stats().completedLots" tone="green" />
    <app-stat-card icon="🧵" [label]="'stat.totalFabric' | t" [value]="stats().totalFabricUsed + ' MTR'" tone="slate" />
    <app-stat-card [hero]="true" icon="🧺" [label]="'stat.totalPieces' | t" [value]="stats().totalPieces" tone="blue" />
  </div>

  <div class="dash-section">
    <div class="dash-section-head">
      <h3>{{ 'tbl.todaysCutting' | t }}</h3>
      <button type="button" class="ghost-button small">{{ 'btn.export' | t }}</button>
    </div>

    @if (!ready()) {
      <app-skeleton-rows [rows]="5" />
    } @else if (lots().length === 0) {
      @if (isParty()) {
        <app-empty-state [title]="'nav.sharedLots' | t" [message]="'shared.none' | t">
          <a class="primary-button" routerLink="/shared-lots">{{ 'shared.addJobber' | t }}</a>
        </app-empty-state>
      } @else {
        <app-empty-state [title]="'empty.noLotsTitle' | t" [message]="'empty.noLotsDash' | t">
          <a class="primary-button" routerLink="/lots/new">{{ 'btn.newLot' | t }}</a>
        </app-empty-state>
      }
    } @else {
      <div class="cut-list">
        @for (lot of today5(); track lot.id) {
          <button type="button" class="cut-row" (click)="open(lot.id)">
            <span class="cut-row-main">
              {{ lot.lotNumber }}<span class="cut-row-sub"> · {{ lot.totalPieces }} pcs</span>
            </span>
            <app-status-badge [status]="lot.status" />
          </button>
        }
      </div>
    }
  </div>
</section>
