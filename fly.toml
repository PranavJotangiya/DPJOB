# Fly.io config — one service, SQLite on a persistent volume.
# Rename `app` to whatever you create with `fly apps create <name>`.
app = "dp-creation"
primary_region = "bom"   # Mumbai; change if you pick another region

[build]

[env]
  PORT = "8080"
  TURSO_DATABASE_URL = "file:/data/app.db"

[http_service]
  internal_port = 8080
  force_https = true
  auto_stop_machines = true
  auto_start_machines = true
  min_machines_running = 0

[[mounts]]
  source = "data"
  destination = "/data"
