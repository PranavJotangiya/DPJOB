[build]
  command = "npm run build"
  publish = "dist"
  functions = "netlify/functions"

[dev]
  command = "npm run dev:client"
  targetPort = 5173
  framework = "#custom"
  autoLaunch = false

[build.environment]
  NODE_VERSION = "20"

[functions]
  node_bundler = "esbuild"
  # @libsql/client ships a native addon; keep it unbundled and copied as-is.
  external_node_modules = ["@libsql/client"]

# API -> serverless function (must come before the SPA catch-all)
[[redirects]]
  from = "/api/*"
  to = "/.netlify/functions/api/:splat"
  status = 200
  force = true

# SPA fallback for client-side routing
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200
